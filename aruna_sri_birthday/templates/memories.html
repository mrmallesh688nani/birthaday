<div class="memory-modal" id="memoryModal" aria-hidden="true">
  <div class="memory-modal-backdrop" data-close-memory></div>
  <div class="memory-modal-card" role="dialog" aria-modal="true" aria-labelledby="memoryModalTitle">
    <button class="memory-modal-close" type="button" aria-label="Close" data-close-memory>×</button>
    <img id="memoryModalImage" src="" alt="">
    <div class="memory-modal-content">
      <div class="section-kicker">A LITTLE MEMORY ✨</div>
      <div class="memory-message-label">A message from Musleee 💌</div>
      <h2 id="memoryModalTitle"></h2>
      <p id="memoryModalText"></p>
    </div>
  </div>
</div>

<script>
(function () {
  const modal = document.getElementById('memoryModal');
  const image = document.getElementById('memoryModalImage');
  const title = document.getElementById('memoryModalTitle');
  const text = document.getElementById('memoryModalText');
  const cards = document.querySelectorAll('.memory-open');

  function closeModal() {
    modal.classList.remove('show');
    modal.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('modal-open');
  }

  cards.forEach(card => card.addEventListener('click', () => {
    image.src = card.dataset.image;
    image.alt = card.dataset.title;
    title.textContent = card.dataset.title;
    text.textContent = card.dataset.text;
    modal.classList.add('show');
    modal.setAttribute('aria-hidden', 'false');
    document.body.classList.add('modal-open');
  }));

  document.querySelectorAll('[data-close-memory]').forEach(el => el.addEventListener('click', closeModal));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
})();
</script>
